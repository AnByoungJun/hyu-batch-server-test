# base 정의 (환경 무관 공통). 단독으로 쓰지 않고 dev/prod override 와 함께 사용한다.
#   dev :  docker compose -f docker-compose.yml -f docker-compose.dev.yml  up -d
#   prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 이미지 주소(image)와 비밀(env_file)은 각 override 에서 지정한다.
services:
  hyu-batch:
    container_name: hyu-batch-server-test
    ports:
      - "8083:8082"
    restart: unless-stopped
