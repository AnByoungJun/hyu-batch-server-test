# ===== 운영(prod) 프로파일 =====
# 인증정보(username/password)는 파일에 두지 않고 반드시 환경변수로 주입한다.
# 미주입 시 애플리케이션이 기동되지 않는다(기본값 없음) → 평문 유출 방지.
#   예) -e DB_USERNAME=... -e DB_PASSWORD=... (필요 시 -e DB_URL=...)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://172.25.0.21:5432/bim_gis}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_MAX:5}

logging:
  level:
    com.sph.hyu.batch: INFO
    org.hibernate.SQL: WARN
